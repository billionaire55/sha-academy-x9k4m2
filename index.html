const Candle = ({ open, close, high, low, x, w = 10 }) => {
  const bull  = close < open;
  const c     = bull ? "#10b981" : "#ef4444";
  const top   = Math.min(open, close);
  const ht    = Math.abs(open - close) || 2;
  return (
    <g>
      <line x1={x} y1={high} x2={x} y2={low} stroke={c} strokeWidth="1.5" />
      <rect x={x - w / 2} y={top} width={w} height={ht} fill={c} />
    </g>
  );
};

                <label style={{display:"block",color:"#9ca3af",fontSize:11,marginBottom:5}}>P&L ($)</label>
                <input type="number" step="0.01" value={form.pnl} onChange={e=>setForm({...form,pnl:e.target.value})} style={{width:"100%",background:"#2a2a2a",border:"1px solid #374151",borderRadius:8,padding:"10px 12px",color:"#fff",fontSize:14}}/>
              </div>
              <div style={{marginBottom:16}}>
                <label style={{display:"block",color:"#9ca3af",fontSize:11,marginBottom:5}}>Notes & Lessons Learned</label>
                <textarea rows={3} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={{width:"100%",background:"#2a2a2a",border:"1px solid #374151",borderRadius:8,padding:"10px 12px",color:"#fff",fontSize:14,resize:"vertical"}}/>
              </div>
              <button onClick={addTrade} style={{width:"100%",padding:"13px",borderRadius:10,background:SHA_GREEN,color:"#fff",fontWeight:700,fontSize:15}}>+ Add Trade</button>
            </div>
            {trades.map(t=>(
              <div key={t.id} style={{background:"#1a1a1a",borderRadius:12,padding:"14px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <span style={{color:"#f9fafb",fontWeight:700}}>{t.asset}</span>
                  <span style={{color:"#6b7280",fontSize:12,marginLeft:8}}>{t.date}</span>
                  <div style={{color:"#9ca3af",fontSize:12,marginTop:4}}>{t.dir.toUpperCase()} · Entry ${t.entry} · Stop ${t.stop}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:t.result==="win"?"#0d2b1e":t.result==="loss"?"#2d0d0d":"#1f2937",color:t.result==="win"?"#10b981":t.result==="loss"?"#ef4444":"#9ca3af"}}>{t.result.toUpperCase()}</span>
                  {t.pnl&&<div style={{color:parseFloat(t.pnl)>=0?"#10b981":"#ef4444",fontWeight:700,marginTop:4,fontSize:15}}>${t.pnl}</div>}
                </div>
              </div>
            ))}
          </div>
        )}

        {activeTool==="stats" && (
          <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[["Total Trades",trades.length,"#9ca3af"],["Wins",wins,"#10b981"],["Losses",losses,"#ef4444"],["Win Rate",`${winRate}%`,parseFloat(winRate)>=50?"#10b981":"#ef4444"]].map(([l,v,c])=>(
                <div key={l} style={{background:"#1a1a1a",borderRadius:14,padding:16,textAlign:"center"}}>
                  <div style={{color:"#9ca3af",fontSize:12,marginBottom:6}}>{l}</div>
                  <div style={{color:c,fontSize:32,fontWeight:800}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{background:"#1a1a1a",borderRadius:14,padding:20,textAlign:"center",marginBottom:12}}>
              <div style={{color:"#9ca3af",fontSize:13,marginBottom:8}}>Total Net P&L</div>
              <div style={{color:netPnL>=0?"#10b981":"#ef4444",fontSize:44,fontWeight:800}}>${netPnL.toFixed(2)}</div>
            </div>
            <div style={{background:"#1a1a1a",borderRadius:14,padding:20}}>
              <p style={{color:SHA_GOLD,fontWeight:700,marginBottom:14}}>📊 Go-Live Readiness</p>
              {[["50+ paper trades",`${trades.length}/50`,trades.length>=50],["Win rate ≥ 50%",`${winRate}%`,parseFloat(winRate)>=50],["Net profitable",`$${netPnL.toFixed(2)}`,netPnL>0]].map(([l,v,ok])=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid #2a2a2a"}}>
                  <span style={{color:"#9ca3af",fontSize:14}}>{l}</span>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <span style={{color:"#fff",fontWeight:600,fontSize:14}}>{v}</span>
                    <span>{ok?"✅":"⏳"}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );

  /* CHECKLIST */
  if (view==="checklist") return (
    <div style={{minHeight:"100vh",background:SHA_DARK,paddingBottom:32}}>
      <div style={{background:"#6d28d9",padding:"24px 20px"}}>
        <button onClick={()=>setView("home")} style={{background:"none",color:"rgba(255,255,255,0.65)",fontSize:14,marginBottom:12}}>← Home</button>
        <h2 style={{fontSize:24,fontWeight:800,color:"#fff"}}>✅ Go-Live Readiness Checklist</h2>
        <p style={{color:"rgba(255,255,255,0.7)",fontSize:13,marginTop:4}}>All items required before trading real money.</p>
      </div>
      <div style={{maxWidth:680,margin:"0 auto",padding:"16px"}}>
        {liveChecklist.map((item,i)=>{
          const checked=checks.includes(i);
          return (
            <button key={i} onClick={()=>setChecks(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i])} style={{width:"100%",textAlign:"left",borderRadius:12,padding:"14px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:14,background:checked?"#0d2b1e":"#1a1a1a",border:`1px solid ${checked?SHA_GREEN:"#2a2a2a"}`,transition:"all .2s"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:checked?SHA_GREEN:"#2a2a2a",color:"#fff",fontWeight:700,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{checked?"✓":i+1}</div>
              <span style={{color:checked?"#a7f3d0":"#d1d5db",fontSize:14,fontWeight:500}}>{item}</span>
            </button>
          );
        })}
        <div style={{background:"#1a1a1a",borderRadius:14,padding:20,marginTop:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{color:"#9ca3af",fontSize:14}}>Readiness</span>
            <span style={{color:SHA_GOLD,fontWeight:700}}>{checks.length}/{liveChecklist.length}</span>
          </div>
          <div style={{background:"#2a2a2a",borderRadius:99,height:10}}>
            <div style={{width:`${(checks.length/liveChecklist.length)*100}%`,background:SHA_GREEN,height:"100%",borderRadius:99,transition:"width .4s"}}/>
          </div>
          {checks.length===liveChecklist.length
            ?<p style={{textAlign:"center",marginTop:16,color:"#10b981",fontWeight:700,fontSize:16}}>🎉 You are ready to go live! Start at 10-20% position sizes.</p>
            :<p style={{textAlign:"center",marginTop:12,color:"#6b7280",fontSize:13}}>Complete all items before risking real capital.</p>}
        </div>
        <div style={{background:"#1a0d0d",borderRadius:14,padding:20,marginTop:12,borderLeft:"4px solid #ef4444"}}>
          <p style={{color:"#ef4444",fontWeight:700,marginBottom:8}}>⚠️ Critical Warning</p>
          <p style={{color:"#fca5a5",fontSize:14,lineHeight:1.65}}>The market will always be open tomorrow. There is no prize for rushing. Traders who go live too early blow up their accounts. Paper trade until ALL boxes are checked.</p>
        </div>
        <p style={{textAlign:"center",color:"#374151",fontSize:11,marginTop:24}}>© 2024 Smarter Hustle Academy™ · Educational Purposes Only</p>
      </div>
    </div>
  );

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
